name: docs-pages

# Build the Sphinx docs and publish the rendered HTML to GitHub Pages, giving a
# live URL reviewers can click. Runs on trusted branch pushes (not on PRs, which
# may come from forks and cannot be granted Pages write permissions).

on:
  push:
    branches:
      - main
      - feature/new_documentation
    paths:
      - 'doc/**'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

# Permissions needed to deploy to GitHub Pages.
permissions:
  contents: read
  pages: write
  id-token: write

# Allow only one concurrent Pages deployment.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Sphinx and the theme
        run: python -m pip install --upgrade "sphinx<8" sphinx-rtd-theme

      - name: Build the HTML docs
        run: make -C doc html

      - name: Upload the Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: doc/build/html

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
