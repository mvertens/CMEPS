name: docs

# Build the Sphinx documentation on any PR (or push) that touches doc/.
# Warnings are treated as errors (-W), so the build fails if the docs are not
# clean. The rendered HTML is uploaded as an artifact reviewers can download and
# open — no local setup required.

on:
  pull_request:
    paths:
      - 'doc/**'
      - '.github/workflows/docs.yml'
  push:
    paths:
      - 'doc/**'
      - '.github/workflows/docs.yml'
  workflow_dispatch:

jobs:
  build-html:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Sphinx and the theme
        run: python -m pip install --upgrade "sphinx<8" sphinx-rtd-theme

      - name: Build the HTML docs (warnings are errors)
        run: make -C doc html SPHINXOPTS="-W --keep-going"

      - name: Upload the built HTML
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cmeps-docs-html
          path: doc/build/html
          if-no-files-found: error
